# Replace domain, paths and certificates. PHP 8.3 FPM must be running.
server {
    listen 80;
    server_name tracking.example.com;
    return 301 https://tracking.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name tracking.example.com;
    root /var/www/fleet-atlas/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/tracking.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracking.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    access_log /var/log/nginx/fleet-atlas.access.log;
    error_log /var/log/nginx/fleet-atlas.error.log;
}
