# Enable ssl, rewrite, proxy and proxy_fcgi. Replace domain and certificate paths.
<VirtualHost *:80>
    ServerName tracking.example.com
    Redirect permanent / https://tracking.example.com/
</VirtualHost>
<VirtualHost *:443>
    ServerName tracking.example.com
    DocumentRoot /var/www/fleet-atlas/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tracking.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tracking.example.com/privkey.pem
    <Directory /var/www/fleet-atlas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/fleet-atlas-error.log
    CustomLog ${APACHE_LOG_DIR}/fleet-atlas-access.log combined
</VirtualHost>
